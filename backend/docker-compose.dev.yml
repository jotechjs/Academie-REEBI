services:
  postgres:
    image: postgres:16
    container_name: reebi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reebi
    ports:
      - "5432:5432"
    volumes:
      - reebi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reebi"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  reebi_postgres_data:
